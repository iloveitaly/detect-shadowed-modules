[project]
name = "detect-shadowed-modules"
version = "0.2.1"
description = "Detect conflicting directory names across Python's sys.path that shadow installed packages"
keywords = ["import", "shadowing", "diagnostics"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/detect-shadowed-modules" }


# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.scripts]
detect-shadowed-modules = "detect_shadowed_modules:main"


[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2; python_version >= '3.12'",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["detect_shadowed_modules"]

[tool.coverage.report]
fail_under = 50
